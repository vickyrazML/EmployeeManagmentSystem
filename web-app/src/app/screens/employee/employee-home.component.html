<div class="container p-8 mx-auto">
    <h1 class="text-2xl font-bold text-center">Employees</h1>
    <!-- employee List Table -->
    <mat-card>
            <div class="p-8">
                <mat-card-title>
                    <div class="flex justify-between items-center">
                        <span class="text-lg font-semibold">Employees List</span>
                        <button mat-flat-button class="bg-blue-500!" (click)="openDialog()" title="Add Employee">Add New Employee</button>
                    </div>  
                </mat-card-title>
                <mat-card-subtitle>
                    <p>Welcome to the employee home page. Here you can manage and view all employees details within the organization.</p>
                    <!-- Table -->
                    <app-table [dataSource]="dataSource" [columns]="displayedColumns"
                    (onedit)="onEdit($event)" (ondelete)="onDelete($event)"></app-table>

                </mat-card-subtitle>
            </div>
    </mat-card>
</div>
